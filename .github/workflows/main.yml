name: GitHub OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC token claims
        shell: bash
        run: |
          set -euo pipefail

          OIDC_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | python -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          python - "$OIDC_TOKEN" <<'PY'
          import sys
          import json
          import base64

          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("Issuer (iss):", claims.get("iss"))
          print("Subject (sub):", claims.get("sub"))
          print("Audience (aud):", claims.get("aud"))
          print("Repository:", claims.get("repository"))
          print("Repository ID:", claims.get("repository_id"))
          print("Repository Owner ID:", claims.get("repository_owner_id"))
          print("Ref:", claims.get("ref"))
          PY