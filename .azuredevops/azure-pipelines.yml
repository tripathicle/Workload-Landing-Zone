trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

paths:
  include:
    - env/**
    - modules/**
    - .azuredevops/**
    - README.md

variables:
  TF_VERSION: '1.8.5'
  TF_IN_AUTOMATION: 'true'
  TF_WORKING_DIR: '$(Build.SourcesDirectory)'
  INFRACOST_API_KEY: '$(INFRACOST_API_KEY)'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true

  - task: UseTerraform@0
    displayName: Install Terraform
    inputs:
      version: '$(TF_VERSION)'
      terraformDirectory: '$(Agent.ToolsDirectory)/terraform'

  - bash: |
      set -euo pipefail
      cd "$(TF_WORKING_DIR)"
      terraform fmt -check -recursive
      terraform init -backend=false -input=false
      terraform validate
    displayName: Terraform Format, Init, and Validate

  - bash: |
      set -euo pipefail
      curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      tflint --init
      tflint --recursive --format compact
    displayName: TFLint
    continueOnError: true

  - bash: |
      set -euo pipefail
      python3 -m pip install --upgrade pip >/dev/null
      python3 -m pip install checkov >/dev/null
      checkov --directory "$(TF_WORKING_DIR)" --quiet || true
    displayName: Checkov Security Scan
    continueOnError: true

  - bash: |
      set -euo pipefail
      curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      tfsec . --format default --soft-fail || true
    displayName: tfsec Scan
    continueOnError: true

  - bash: |
      set -euo pipefail
      curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      trivy fs --security-checks vuln,config --severity HIGH,CRITICAL --exit-code 0 . || true
    displayName: Trivy Scan
    continueOnError: true

  - bash: |
      set -euo pipefail
      curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      trufflehog filesystem --directory . || true
    displayName: TruffleHog Secret Scan
    continueOnError: true

  - bash: |
      set -euo pipefail
      if [ -n "$(INFRACOST_API_KEY)" ]; then
        curl -sSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | bash
        cd "$(TF_WORKING_DIR)"
        infracost breakdown --path . --format json --out-file infracost.json || true
      else
        echo "Skipping Infracost because INFRACOST_API_KEY is not configured."
      fi
    displayName: Infracost Cost Estimate
    continueOnError: true

  - bash: |
      set -euo pipefail
      if [[ "$(Build.Reason)" == "PullRequest" ]]; then
        echo "PR validation only; skipping apply."
        exit 0
      fi
      cd "$(TF_WORKING_DIR)/env/dev"
      terraform plan -input=false -out=tfplan
    displayName: Terraform Plan
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - publish: '$(TF_WORKING_DIR)/tfplan'
    displayName: Publish Terraform Plan
    artifact: tfplan
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
